<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Leaf — Desktop reader · Design A</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181b1a;
        --side: #141716;
        --panel: #1f2321;
        --hover: #292f2b;
        --line: #303632;
        --text: #edf0e9;
        --muted: #a0aaa1;
        --sage: #bfd3ab;
        --ink: #1c291b;
        --danger: #e7a798;
        --radius: 10px;
        font-family:
          Segoe UI,
          Arial,
          sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input,
      select {
        font: inherit;
      }
      button,
      select {
        cursor: pointer;
      }
      button {
        color: inherit;
        border: 0;
        background: none;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button,
      a,
      input,
      select {
        outline-offset: 4px;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--sage);
      }
      button {
        transition:
          background 0.15s,
          transform 0.15s;
      }
      button:hover {
        background: var(--hover);
      }
      a {
        color: var(--sage);
      }
      svg.ico {
        width: 19px;
        height: 19px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.6;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }
      .review {
        height: 46px;
        background: #101211;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 22px;
        font-size: 11px;
        letter-spacing: 0.03em;
      }
      .review-label {
        color: var(--sage);
        font-weight: 600;
      }
      .review-label span {
        color: #879187;
        font-weight: 400;
        margin-left: 10px;
      }
      .review-nav {
        display: flex;
        height: 100%;
        gap: 3px;
      }
      .review-nav button {
        font-size: 11px;
        padding: 0 15px;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .review-nav button.active {
        color: var(--text);
        border-color: var(--sage);
      }
      .review select {
        margin-left: auto;
        max-width: 225px;
        background: #1e231f;
        color: #bdc6bd;
        border: 1px solid var(--line);
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 11px;
      }
      .shell {
        display: flex;
        min-height: calc(100vh - 46px);
      }
      .sidebar {
        width: 196px;
        flex-shrink: 0;
        background: var(--side);
        border-right: 1px solid var(--line);
        padding: 30px 18px 20px;
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: calc(100vh - 46px);
      }
      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        font-family: Georgia, serif;
        font-size: 29px;
        letter-spacing: -1px;
        padding: 0 13px 38px;
      }
      .brand svg {
        width: 28px;
        height: 28px;
        color: var(--sage);
      }
      .side-label {
        font-size: 10px;
        color: #89948a;
        letter-spacing: 1.7px;
        padding: 0 13px;
        margin: 0 0 12px;
      }
      .side-nav {
        display: grid;
        gap: 6px;
      }
      .side-nav button {
        display: flex;
        align-items: center;
        gap: 12px;
        text-align: left;
        width: 100%;
        padding: 12px;
        border-radius: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .side-nav button.active {
        background: #2a3329;
        color: var(--sage);
      }
      .count {
        margin-left: auto;
        font-size: 11px;
        color: var(--muted);
      }
      .side-bottom {
        margin-top: auto;
      }
      .local-note {
        border-top: 1px solid var(--line);
        padding: 20px 12px 0;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.7;
      }
      .dot {
        width: 6px;
        height: 6px;
        display: inline-block;
        border-radius: 50%;
        background: var(--sage);
        margin-right: 7px;
      }
      .side-bottom .side-nav {
        margin-bottom: 24px;
      }
      .workspace {
        flex: 1;
        min-width: 0;
      }
      .appbar {
        height: 64px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 36px;
        color: var(--muted);
        font-size: 12px;
      }
      .breadcrumb {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .breadcrumb strong {
        font-weight: 400;
        color: var(--text);
      }
      .kbd {
        font-size: 10px;
        border: 1px solid #424a43;
        border-radius: 4px;
        padding: 2px 5px;
        color: var(--muted);
      }
      .main-layout {
        display: flex;
        min-height: calc(100vh - 110px);
      }
      .library-main {
        flex: 1;
        min-width: 0;
        padding: 33px 35px 24px;
      }
      .eyebrow {
        color: var(--sage);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
      }
      h1 {
        font-weight: 400;
        letter-spacing: -1.5px;
        font-size: 38px;
        line-height: 1.15;
        margin: 10px 0;
      }
      h2 {
        font-size: 20px;
        font-weight: 500;
        letter-spacing: -0.5px;
        margin: 0 0 10px;
      }
      h3 {
        font-size: 14px;
        font-weight: 500;
        margin: 0 0 6px;
      }
      p {
        line-height: 1.65;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        margin-bottom: 26px;
      }
      .page-heading p {
        margin: 8px 0 0;
        font-size: 12px;
        color: var(--muted);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border: 1px solid #414a40;
        border-radius: 6px;
        padding: 10px 15px;
        font-size: 12px;
        white-space: nowrap;
        min-height: 38px;
      }
      .btn.primary {
        background: var(--sage);
        color: var(--ink);
        border-color: var(--sage);
        font-weight: 600;
      }
      .btn.primary:hover {
        background: #d0e1c0;
      }
      .btn.danger {
        color: #f1b5a8;
        border-color: #704b42;
        background: #302320;
      }
      .btn.ghost {
        border-color: transparent;
        color: var(--muted);
      }
      .btn.wide {
        width: 100%;
      }
      .icon-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 34px;
        height: 34px;
        border-radius: 5px;
        color: var(--muted);
      }
      .resume {
        display: flex;
        align-items: center;
        gap: 20px;
        background: linear-gradient(110deg, #2b342b, #222923);
        border: 1px solid #3b4739;
        border-radius: 9px;
        padding: 19px 22px;
        margin-bottom: 28px;
        position: relative;
        overflow: hidden;
      }
      .resume:after {
        content: "";
        position: absolute;
        right: 36px;
        top: -58px;
        width: 210px;
        height: 210px;
        border: 1px solid #bfd3ab0b;
        border-radius: 50%;
        pointer-events: none;
      }
      .resume .cover {
        width: 59px;
        flex: 0 0 59px;
        border-radius: 2px;
      }
      .resume-copy {
        flex: 1;
        min-width: 0;
      }
      .resume-copy h2 {
        font-family: Georgia, serif;
        font-size: 23px;
        font-weight: 400;
        margin: 5px 0;
      }
      .resume-copy .eyebrow {
        font-size: 9px;
        letter-spacing: 1.5px;
      }
      .resume-copy p {
        font-size: 11px;
        margin: 5px 0 0;
        color: #b3beaf;
      }
      .resume .btn {
        z-index: 1;
      }
      .section-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--line);
        padding-bottom: 14px;
        margin-bottom: 22px;
      }
      .section-heading h2 {
        font-size: 15px;
        margin: 0;
        letter-spacing: 0;
      }
      .section-heading span {
        font-size: 11px;
        color: var(--muted);
      }
      .book-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 25px 25px;
      }
      .book {
        position: relative;
        min-width: 0;
      }
      .book-select {
        padding: 0;
        width: 100%;
        text-align: left;
        border-radius: 5px;
        display: block;
      }
      .book-select:hover {
        background: none;
      }
      .cover-wrap {
        padding: 6px;
        border: 1px solid transparent;
        border-radius: 5px;
        transition:
          border-color 0.15s,
          background 0.15s;
      }
      .book.selected .cover-wrap {
        border-color: #92aa80;
        background: #303b2d;
      }
      .book-select:hover .cover-wrap {
        background: #303630;
      }
      .cover {
        display: block;
        aspect-ratio: 3/4.15;
        overflow: hidden;
        border-radius: 3px;
        box-shadow: 3px 6px 14px #0004;
        position: relative;
        width: 100%;
      }
      .cover:after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          #0003,
          transparent 3%,
          #fff1 5%,
          transparent 8%,
          transparent 96%,
          #0002
        );
        pointer-events: none;
      }
      .cover svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .book-info {
        padding: 10px 6px 0;
      }
      .book-title {
        font-size: 12px;
        line-height: 1.4;
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .book-author {
        font-size: 10px;
        color: var(--muted);
        margin-top: 4px;
        display: block;
      }
      .progress-row {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-top: 11px;
        color: #a7b69d;
        font-size: 9px;
      }
      .track {
        height: 3px;
        background: #363d36;
        flex: 1;
        border-radius: 8px;
        overflow: hidden;
      }
      .track i {
        display: block;
        height: 100%;
        background: #a9bd96;
        border-radius: 8px;
      }
      .book-menu {
        position: absolute;
        right: 8px;
        top: 10px;
        background: #111b;
        backdrop-filter: blur(8px);
        color: white;
        width: 26px;
        height: 26px;
        opacity: 0;
      }
      .book:hover .book-menu,
      .book-menu:focus-visible {
        opacity: 1;
      }
      .library-footer {
        display: flex;
        gap: 7px;
        align-items: center;
        color: #8f9c91;
        font-size: 10px;
        margin-top: 29px;
      }
      .library-footer .ico {
        width: 13px;
        height: 13px;
      }
      .details {
        width: 274px;
        flex-shrink: 0;
        align-self: flex-start;
        position: sticky;
        top: 0;
        height: calc(100vh - 110px);
        min-height: 650px;
        overflow: auto;
        border-left: 1px solid var(--line);
        background: #1c201e;
        padding: 23px 24px;
        display: flex;
        flex-direction: column;
      }
      .detail-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1.4px;
        margin-bottom: 16px;
      }
      .details > .cover {
        width: 126px;
        align-self: center;
        margin: 5px 0 22px;
      }
      .details h2 {
        font-family: Georgia, serif;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.2;
        margin-bottom: 7px;
      }
      .details .author {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 23px;
      }
      .detail-label {
        font-size: 10px;
        color: var(--muted);
      }
      .detail-progress {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-size: 11px;
      }
      .details .track {
        flex: none;
        height: 4px;
      }
      .detail-chapter {
        font-size: 11px;
        color: var(--muted);
        margin: 10px 0 20px;
      }
      .metadata {
        border-top: 1px solid var(--line);
        padding-top: 17px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 17px;
        font-size: 11px;
      }
      .metadata span {
        display: block;
        font-size: 10px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .file-note {
        margin: 23px 0;
        font-size: 10px;
        color: var(--muted);
        line-height: 1.7;
        overflow-wrap: anywhere;
      }
      .detail-actions {
        margin-top: auto;
        display: grid;
        gap: 6px;
        padding-top: 16px;
      }
      .detail-actions .ghost {
        font-size: 11px;
      }
      .close-detail {
        display: none;
      }
      .settings-main {
        max-width: 1010px;
        padding: 38px 45px;
        margin: 0 auto;
      }
      .settings-main > .muted {
        font-size: 12px;
      }
      .tabs {
        display: flex;
        gap: 24px;
        margin-top: 30px;
        border-bottom: 1px solid var(--line);
      }
      .tabs button {
        padding: 14px 1px;
        color: var(--muted);
        font-size: 12px;
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: var(--sage);
        border-color: var(--sage);
      }
      .settings-content {
        padding-top: 30px;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 30px;
      }
      .card {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 9px;
        padding: 24px;
      }
      .card p {
        font-size: 12px;
        color: var(--muted);
        margin: 8px 0 20px;
      }
      .form-row {
        border-top: 1px solid var(--line);
        padding: 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 15px;
      }
      .form-row:last-child {
        padding-bottom: 0;
      }
      .form-row label {
        font-size: 12px;
      }
      .form-row small {
        display: block;
        color: var(--muted);
        font-size: 10px;
        margin-top: 5px;
        line-height: 1.5;
      }
      .field {
        background: #181d19;
        color: var(--text);
        border: 1px solid #424a40;
        border-radius: 5px;
        padding: 8px 10px;
        font-size: 11px;
        max-width: 210px;
      }
      .segmented {
        display: inline-flex;
        border: 1px solid #414b40;
        border-radius: 6px;
        padding: 3px;
        gap: 3px;
      }
      .segmented button {
        font-size: 11px;
        padding: 7px 12px;
        border-radius: 3px;
        color: var(--muted);
      }
      .segmented button.active {
        background: #394633;
        color: #d0e1bf;
      }
      .themes {
        display: flex;
        gap: 8px;
        margin: 18px 0 23px;
      }
      .theme {
        flex: 1;
        border: 1px solid #444b42;
        border-radius: 6px;
        padding: 11px 5px;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        align-items: center;
      }
      .theme b {
        font-family: Georgia, serif;
        font-size: 21px;
        font-weight: 400;
      }
      .theme[data-theme="light"] {
        background: #f7f7f2;
        color: #32382f;
      }
      .theme[data-theme="sepia"] {
        background: #eee5d2;
        color: #4b4336;
      }
      .theme[data-theme="dark"] {
        background: #232721;
        color: #d4d7cc;
      }
      .theme[data-theme="system"] {
        background: linear-gradient(125deg, #f1eee2 50%, #252a24 50%);
        color: #a9b79f;
      }
      .theme.active {
        outline: 2px solid var(--sage);
        outline-offset: 3px;
      }
      .stepper {
        display: flex;
        align-items: center;
        border: 1px solid #424b41;
        border-radius: 5px;
        overflow: hidden;
      }
      .stepper button {
        height: 31px;
        width: 31px;
        color: var(--muted);
        font-size: 17px;
      }
      .stepper output {
        min-width: 54px;
        text-align: center;
        font-size: 11px;
      }
      .type-preview {
        background: #eee5d2;
        color: #4b4336;
        border-radius: 7px;
        padding: 28px 25px;
        min-height: 245px;
        overflow: hidden;
      }
      .type-preview .eyebrow {
        color: #7a7963;
        font-size: 9px;
      }
      .type-preview h3 {
        font-family: Georgia, serif;
        font-size: 25px;
        font-weight: 400;
        margin: 20px 0 12px;
      }
      .type-preview p {
        font-size: 16px;
        line-height: 1.7;
        color: inherit;
      }
      .info-line {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 11px;
        color: var(--muted);
        line-height: 1.6;
        margin-top: 20px;
      }
      .info-line .ico {
        width: 16px;
        height: 16px;
      }
      .font-card {
        display: flex;
        align-items: center;
        gap: 30px;
        padding: 23px;
        border-bottom: 1px solid var(--line);
      }
      .font-card:last-child {
        border: 0;
      }
      .font-sample {
        font-size: 44px;
        width: 70px;
        color: #d7dfcc;
      }
      .font-description {
        flex: 1;
      }
      .font-description h3 {
        margin-bottom: 7px;
      }
      .font-description p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
      }
      .badge {
        display: inline-block;
        font-size: 9px;
        padding: 4px 7px;
        background: #2d392a;
        color: var(--sage);
        border-radius: 4px;
      }
      .status-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        border: 1px solid #45543d;
        background: #263023;
        border-radius: 7px;
        padding: 18px;
        margin: 20px 0;
      }
      .status-box p {
        margin: 4px 0 0;
        font-size: 11px;
      }
      .setup-step {
        display: flex;
        gap: 14px;
        margin: 23px 0;
      }
      .step-number {
        border: 1px solid #4a5545;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        color: var(--sage);
        font-size: 11px;
        flex-shrink: 0;
      }
      .setup-step p {
        margin: 5px 0;
        font-size: 11px;
        color: var(--muted);
      }
      code {
        font-size: 10px;
        display: block;
        padding: 12px;
        background: #151915;
        border-radius: 5px;
        margin: 10px 0;
        color: #c7d4bd;
        overflow-wrap: anywhere;
      }
      .reader {
        min-height: calc(100vh - 46px);
        position: relative;
        background: #eee7d8;
        color: #3b4035;
        --paper: #eee7d8;
        --reading-ink: #3b4035;
      }
      .reader[data-theme="light"] {
        background: #fafaf5;
        --paper: #fafaf5;
        --reading-ink: #30372e;
      }
      .reader[data-theme="dark"] {
        background: #20251f;
        color: #d4d9cb;
        --paper: #20251f;
        --reading-ink: #d4d9cb;
      }
      .reader[data-theme="system"] {
        background: #20251f;
        color: #d4d9cb;
        --paper: #20251f;
        --reading-ink: #d4d9cb;
      }
      .reader-toolbar {
        height: 69px;
        padding: 0 27px;
        display: flex;
        align-items: center;
        gap: 17px;
        border-bottom: 1px solid #76816c30;
        background: var(--paper);
        color: var(--reading-ink);
        position: sticky;
        top: 0;
        z-index: 3;
        transition: opacity 0.2s;
      }
      .reader-toolbar .icon-btn {
        color: inherit;
      }
      .reader-toolbar .divider {
        height: 22px;
        width: 1px;
        background: #7d846f40;
      }
      .reader-book-label {
        font-size: 12px;
      }
      .reader-book-label span {
        font-size: 10px;
        opacity: 0.65;
        margin-left: 12px;
      }
      .reader-tools {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-left: auto;
      }
      .reader .segmented {
        border-color: #9b9d8c60;
      }
      .reader .segmented button {
        color: inherit;
      }
      .reader .segmented button.active {

            (el.onclick = () => {
              route = "settings";
              settingTab = el.dataset.setting;
              render();
            }),
        );
        document
          .querySelectorAll("[data-scenario]")
          .forEach((el) => (el.onclick = () => scenario(el.dataset.scenario)));
        document.querySelectorAll("[data-theme]").forEach((el) => {
          if (el.tagName !== "BUTTON") return;
          el.onclick = () => {
            theme = el.dataset.theme;
            render();
            applyReadingPrefs();
          };
        });
        document.querySelectorAll("[data-mode]").forEach(
          (el) =>
            (el.onclick = () => {
              mode = el.dataset.mode;
              render();
            }),
        );
        document.querySelectorAll("[data-step]").forEach(
          (el) =>
            (el.onclick = () => {
              const [key, delta, min, max] = el.dataset.step.split(",");
              prefs[key] = Math.max(
                +min,
                Math.min(+max, Math.round((prefs[key] + +delta) * 10) / 10),
              );
              render();
              applyReadingPrefs();
            }),
        );
        document.querySelectorAll(".font-select").forEach(
          (el) =>
            (el.onchange = () => {
              font = el.value;
              render();
              applyReadingPrefs();
            }),
        );
        document.querySelectorAll("[data-panel]").forEach(
          (el) =>
            (el.onclick = () => {
              readerPanel =
                readerPanel === el.dataset.panel ? "" : el.dataset.panel;
              render();
            }),
        );
        document.querySelectorAll("[data-chapter]").forEach(
          (el) =>
            (el.onclick = () => {
              chapter = Number(el.dataset.chapter);
              chapterProgress = 0;
              readerPanel = "";
              render();
              window.scrollTo(0, 0);
            }),
        );
        const mark = $("#demo-selection");
        if (mark)
          mark.onclick = (event) => {
            event.stopPropagation();
            selectionText = german[0][0];
            selectionRect = mark.getBoundingClientRect();
            selectionAction();
          };
        const page = $("#book-page");
        if (page) {
          page.onmouseup = () => {
            const selection = window.getSelection();
            if (selection?.toString().trim()) {
              selectionText = selection.toString();
              selectionRect = selection.getRangeAt(0).getBoundingClientRect();
              selectionAction();
            }
          };
          page.onclick = (event) => {
            if (
              !event.target.closest("mark") &&
              !window.getSelection()?.toString()
            )
              $(".reader-toolbar")?.classList.toggle("hidden");
          };
        }
        applyReadingPrefs();
      }
      $("#scenarios").onchange = (event) => {
        if (event.target.value) scenario(event.target.value);
      };
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if ($("#overlay").innerHTML) {
            clearTimeout(translationTimer);
            closeModal();
          } else if (readerPanel) {
            readerPanel = "";
            render();
          } else if (route === "reader") navigate("library");
          return;
        }
        if (event.key === "Tab" && $(".modal")) {
          const controls = Array.from(
            $(".modal").querySelectorAll(
              'button,a,select,input,[tabindex="0"]',
            ),
          ).filter((el) => !el.disabled);
          const first = controls[0],
            last = controls.at(-1);
          if (event.shiftKey && document.activeElement === first) {
            event.preventDefault();
            last?.focus();
          } else if (!event.shiftKey && document.activeElement === last) {
            event.preventDefault();
            first?.focus();
          }
          return;
        }
        if (
          route === "reader" &&
          mode === "paginated" &&
          !readerPanel &&
          !$("#overlay").innerHTML &&
          !["INPUT", "SELECT", "BUTTON"].includes(event.target.tagName) &&
          !window.getSelection()?.toString()
        ) {
          if (["ArrowRight", "PageDown", " "].includes(event.key)) {
            event.preventDefault();
            nextPage(1);
          }
          if (["ArrowLeft", "PageUp"].includes(event.key)) {
            event.preventDefault();
            nextPage(-1);
          }
        }
      });
      document.addEventListener("pointerdown", (event) => {
        if (
          $(".translation-bubble") &&
          !event.target.closest(".translation-bubble") &&
          !event.target.closest("#scenarios")
        ) {
          clearTimeout(translationTimer);
          dismiss();
        }
      });
      window.addEventListener("resize", () => {
        if ($(".translation-bubble")) {
          selectionRect = null;
          showBubble();
        }
      });
      render();
    </script>
  </body>
</html>
